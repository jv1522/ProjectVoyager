    <text x="18" y="314" fill="#f1f3f4" class="label">Synced Performance</text>
    <text x="18" y="331" fill="#a8b7bd" class="micro">Video + notation · slow · loop · compare</text>
  </g>

  <!-- Practice Workbench -->
  <g transform="translate(395 474)">
    <rect width="330" height="346" class="card" fill="#e8edf1"/>
    <rect x="18" y="18" width="294" height="199" rx="8" fill="#fbfcfd" stroke="#d4dce2"/>
    <rect x="18" y="18" width="294" height="31" rx="8" fill="#f0f3f5"/>
    <text x="31" y="38" fill="#4a5863" class="micro">PLAY   LOOP   TEMPO   COUNT-IN   MIX</text>
    <text x="31" y="68" fill="#29343c" class="tiny">LEAVING EARTH</text>
    <g stroke="#b4bec5" class="staff"><path d="M32 102H298 M32 112H298 M32 122H298 M32 132H298 M32 142H298"/></g>
    <g fill="#374a55"><ellipse cx="100" cy="112" rx="6" ry="3.5"/><ellipse cx="161" cy="132" rx="6" ry="3.5"/><ellipse cx="224" cy="122" rx="6" ry="3.5"/></g>
    <path d="M185 94V152" stroke="#328c86" stroke-width="2"/>
    <rect x="32" y="165" width="266" height="34" rx="6" fill="#edf2f4"/>
    <text x="42" y="180" fill="#3d515d" class="micro">METRONOME</text><text x="42" y="192" fill="#73848e" class="micro">60 BPM · 4/4</text>
    <rect x="18" y="230" width="294" height="46" rx="9" fill="#dbe3e8"/>
    <circle cx="45" cy="253" r="13" fill="#fff"/><path d="M43 246l10 7-10 7z" fill="#328c86"/>
    <path d="M76 253h207" stroke="#b7c3ca" stroke-width="4" stroke-linecap="round"/>
    <circle cx="176" cy="253" r="5" fill="#328c86"/>
    <text x="18" y="314" fill="#29343c" class="label">Practice Workbench</text>
    <text x="18" y="331" fill="#667781" class="micro">Docked tools · compact · easy to control</text>
  </g>

  <!-- Parchment Recital -->
  <g transform="translate(750 474)">
    <rect width="330" height="346" class="card" fill="#d9c9a9"/>
    <rect x="30" y="18" width="270" height="199" rx="4" fill="#f5ecd7" stroke="#c7b58f"/>
    <path d="M46 35H283" stroke="#d6c6a5"/>
    <text x="48" y="55" fill="#554a38" class="tiny">LEAVING EARTH</text>
    <text x="48" y="68" fill="#8a7b61" class="micro">Andante · A minor</text>
    <g stroke="#b4a587" class="staff"><path d="M48 101H282 M48 111H282 M48 121H282 M48 131H282 M48 141H282"/><path d="M48 164H282 M48 174H282 M48 184H282 M48 194H282 M48 204H282"/></g>
    <g fill="#574b37"><ellipse cx="107" cy="121" rx="6" ry="3.5"/><ellipse cx="174" cy="111" rx="6" ry="3.5"/><ellipse cx="240" cy="131" rx="6" ry="3.5"/></g>
    <path d="M205 94V149" stroke="#26766e" stroke-width="2"/>
