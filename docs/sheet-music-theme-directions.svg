    <text x="80" y="249" fill="#f3f6fb" class="tiny">TEMPO</text><text x="80" y="263" fill="#96a5b8" class="micro">60 BPM</text>
    <path d="M145 254h142" stroke="#435169" stroke-width="4" stroke-linecap="round"/>
    <text x="18" y="314" fill="#f4f6fb" class="label">Note Highway</text>
    <text x="18" y="331" fill="#96a5b8" class="micro">String lanes · approach line · rhythm cues</text>
  </g>

  <!-- Friendly Coach -->
  <g transform="translate(1105 98)">
    <rect width="295" height="346" class="card" fill="url(#coach)"/>
    <rect x="16" y="17" width="263" height="200" rx="12" fill="#fffdfb"/>
    <text x="31" y="41" fill="#37344b" class="tiny">TODAY'S PRACTICE</text>
    <text x="31" y="57" fill="#8a8598" class="micro">A minor · slow and steady</text>
    <rect x="31" y="74" width="233" height="65" rx="11" fill="#f2f0ff"/>
    <text x="45" y="101" fill="#5147a0" class="label" font-size="21">Am</text>
    <g fill="#8a80d4"><circle cx="202" cy="91" r="5"/><circle cx="220" cy="91" r="5"/><circle cx="238" cy="91" r="5"/></g>
    <text x="45" y="123" fill="#77718d" class="micro">Let each string ring</text>
    <rect x="31" y="151" width="107" height="42" rx="12" fill="#e1f3eb"/>
    <text x="45" y="168" fill="#3d7c65" class="tiny">LISTEN</text><text x="45" y="183" fill="#55937b" class="micro">Play it once</text>
    <rect x="148" y="151" width="116" height="42" rx="12" fill="#ffebe4"/>
    <text x="162" y="168" fill="#a85d4d" class="tiny">YOUR TURN</text><text x="162" y="183" fill="#bb796a" class="micro">Take your time</text>
    <rect x="16" y="230" width="263" height="46" rx="13" fill="#ded9fa"/>
    <circle cx="43" cy="253" r="13" fill="#fff"/><path d="M41 246l10 7-10 7z" fill="#756ac6"/>
    <path d="M72 253h184" stroke="#c4bdf0" stroke-width="5" stroke-linecap="round"/>
    <text x="16" y="314" fill="#37344b" class="label">Friendly Coach</text>
    <text x="16" y="331" fill="#77718d" class="micro">Soft colors · chord cards · clear steps</text>
  </g>

  <!-- Synced Performance -->
  <g transform="translate(40 474)">
    <rect width="330" height="346" class="card" fill="#17212b"/>
    <rect x="18" y="18" width="294" height="114" rx="8" fill="url(#syncVideo)"/>
    <circle cx="166" cy="74" r="22" fill="#ffffff" opacity=".22"/>
    <path d="M161 61l20 13-20 13z" fill="#ffffff"/>
    <text x="30" y="119" fill="#ffffff" class="micro">LOCAL PERFORMANCE VIDEO</text>
