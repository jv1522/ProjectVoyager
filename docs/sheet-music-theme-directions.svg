    <text x="47" y="258" fill="#6a5b42" class="tiny">‹     PAGE 1 OF 3     ›</text>
    <path d="M250 252h31" stroke="#26766e" stroke-width="3" stroke-linecap="round"/>
    <rect x="204" y="291" width="92" height="21" rx="10" fill="#26766e"/>
    <text x="250" y="305" text-anchor="middle" fill="#ffffff" class="micro">SELECTED</text>
    <text x="18" y="314" fill="#554a38" class="label">Parchment Recital</text>
    <text x="18" y="331" fill="#82745d" class="micro">Warm page · quiet controls · page turns</text>
  </g>

  <!-- Modern Composer -->
  <g transform="translate(1105 474)">
    <rect width="295" height="346" class="card" fill="#edf1f8"/>
    <rect x="16" y="18" width="263" height="199" rx="9" fill="#ffffff" stroke="#dce3ee"/>
    <rect x="16" y="18" width="263" height="34" rx="9" fill="#f7f9fc"/>
