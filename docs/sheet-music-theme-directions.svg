    <rect x="16" y="230" width="263" height="46" rx="9" fill="#e0e8f6"/>
    <circle cx="43" cy="253" r="13" fill="#fff"/><path d="M41 246l10 7-10 7z" fill="#5879b7"/>
    <text x="72" y="249" fill="#4d638c" class="tiny">EDIT SCORE</text><text x="72" y="263" fill="#8192ad" class="micro">Click to enter notes</text>
    <text x="16" y="314" fill="#293b57" class="label">Modern Composer</text>
    <text x="16" y="331" fill="#71809a" class="micro">Bright workspace · clear tools · editable score</text>
