    <g stroke="#9e9c94" class="staff"><path d="M32 165H298 M32 174H298 M32 183H298 M32 192H298 M32 201H298"/></g>
    <path d="M124 158V208" stroke="#df9c50" stroke-width="2"/>
    <g fill="#39444c"><ellipse cx="91" cy="183" rx="6" ry="3.5"/><ellipse cx="150" cy="174" rx="6" ry="3.5"/><ellipse cx="214" cy="192" rx="6" ry="3.5"/></g>
    <rect x="18" y="230" width="294" height="46" rx="9" fill="#243441"/>
    <circle cx="45" cy="253" r="13" fill="#354a58"/><path d="M43 246l10 7-10 7z" fill="#f6cf8a"/>
