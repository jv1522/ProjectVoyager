<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
  <title id="title">Eight original sheet music player theme concepts</title>
  <desc id="description">A two-row visual board of eight distinct guitar score-player mockups, with Parchment Recital and its Studio Engraver-inspired notation marked as selected.</desc>
  <defs>
    <style>
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 600 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .micro { font: 600 7px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .staff { stroke-width: 1; }
      .note { stroke-width: 2; stroke-linecap: round; }
      .card { rx: 17; }
    </style>
    <linearGradient id="highway" x2="0" y2="1">
      <stop stop-color="#131a2d"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>
    <linearGradient id="coach" x2="1" y2="1">
      <stop stop-color="#ece9ff"/>
      <stop offset="1" stop-color="#ffe6df"/>
    </linearGradient>
    <linearGradient id="syncVideo" x2="1" y2="1">
      <stop stop-color="#193f55"/>
      <stop offset="1" stop-color="#d58b54"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="850" fill="#101722"/>
  <text x="48" y="46" fill="#f3f5f8" class="label" font-size="24">SHEET MUSIC PLAYER · VISUAL DIRECTIONS</text>
  <text x="48" y="69" fill="#aab5c5" class="tiny" font-size="12">Original concept sketches — illustrative mockups, not screenshots of the referenced products</text>

  <!-- Studio Engraver -->
  <g transform="translate(40 98)">
    <rect width="330" height="346" class="card" fill="#f6f5f0"/>
    <rect x="18" y="18" width="294" height="199" rx="8" fill="#fffefa" stroke="#dedbd1"/>
    <text x="32" y="39" fill="#292a2b" class="tiny">LEAVING EARTH</text>
    <text x="32" y="52" fill="#77766f" class="micro">A minor · 4/4</text>
    <g stroke="#c7c5be" class="staff">
      <path d="M32 91H298 M32 101H298 M32 111H298 M32 121H298 M32 131H298"/>
      <path d="M32 151H298 M32 161H298 M32 171H298 M32 181H298 M32 191H298"/>
    </g>
    <path d="M102 91v40 M162 101v30 M223 111v20" stroke="#242526" class="note"/>
    <g fill="#242526"><ellipse cx="102" cy="91" rx="7" ry="4"/><ellipse cx="162" cy="111" rx="7" ry="4"/><ellipse cx="223" cy="121" rx="7" ry="4"/></g>
    <path d="M192 80V199" stroke="#26827e" stroke-width="2"/>
    <rect x="18" y="230" width="294" height="46" rx="9" fill="#eae8e1"/>
    <circle cx="45" cy="253" r="13" fill="#fffefa"/><path d="M43 246l10 7-10 7z" fill="#3f625f"/>
    <path d="M76 253h207" stroke="#c7c5be" stroke-width="4" stroke-linecap="round"/>
    <circle cx="158" cy="253" r="5" fill="#26827e"/>
    <text x="18" y="314" fill="#272927" class="label">Studio Engraver</text>
    <text x="18" y="331" fill="#77766f" class="micro">Paper · precise ink · restrained teal</text>
  </g>

  <!-- Voyager Dark Studio -->
  <g transform="translate(395 98)">
    <rect width="330" height="346" class="card" fill="#111a2a"/>
    <rect x="18" y="18" width="294" height="199" rx="8" fill="#172337" stroke="#27364c"/>
    <text x="32" y="39" fill="#f4ead2" class="tiny">LEAVING EARTH</text>
    <text x="32" y="52" fill="#91a1b6" class="micro">A minor · 4/4</text>
    <g stroke="#78879b" class="staff" opacity=".8">
      <path d="M32 91H298 M32 101H298 M32 111H298 M32 121H298 M32 131H298"/>
      <path d="M32 151H298 M32 161H298 M32 171H298 M32 181H298 M32 191H298"/>
    </g>
    <path d="M105 91v40 M168 101v30 M231 111v20" stroke="#f1c66d" class="note"/>
    <g fill="#f1c66d"><ellipse cx="105" cy="91" rx="7" ry="4"/><ellipse cx="168" cy="111" rx="7" ry="4"/><ellipse cx="231" cy="121" rx="7" ry="4"/></g>
    <path d="M198 80V199" stroke="#ffd783" stroke-width="2"/>
    <rect x="18" y="230" width="294" height="46" rx="9" fill="#1c2a3e"/>
    <circle cx="45" cy="253" r="13" fill="#293b52"/><path d="M43 246l10 7-10 7z" fill="#f1c66d"/>
    <path d="M76 253h207" stroke="#3b4b60" stroke-width="4" stroke-linecap="round"/>
    <circle cx="158" cy="253" r="5" fill="#f1c66d"/>
    <text x="18" y="314" fill="#f4ead2" class="label">Voyager Dark Studio</text>
    <text x="18" y="331" fill="#91a1b6" class="micro">Midnight blue · ivory · Voyager gold</text>
  </g>

  <!-- Note Highway -->
  <g transform="translate(750 98)">
    <rect width="330" height="346" class="card" fill="#111827"/>
    <rect x="18" y="18" width="294" height="199" rx="8" fill="url(#highway)"/>
    <text x="32" y="39" fill="#f4f6fb" class="tiny">LEAVING EARTH</text>
    <text x="32" y="52" fill="#8592a8" class="micro">SIX-STRING PRACTICE LANE</text>
    <g stroke="#334052" stroke-width="2">
      <path d="M35 82H295 M35 104H295 M35 126H295 M35 148H295 M35 170H295 M35 192H295"/>
    </g>
    <g>
      <rect x="69" y="74" width="22" height="16" rx="5" fill="#ef7379"/><rect x="135" y="96" width="22" height="16" rx="5" fill="#f0aa61"/>
      <rect x="183" y="118" width="22" height="16" rx="5" fill="#ebd765"/><rect x="224" y="140" width="22" height="16" rx="5" fill="#78d09b"/>
      <rect x="250" y="162" width="22" height="16" rx="5" fill="#69bce0"/><rect x="279" y="184" width="22" height="16" rx="5" fill="#bb91ed"/>
